name: Build and push bc-runner image

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'extensions/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Canonical image name MUST match what consumers pull. Until 2026-04-07
  # this was `stefanmaron/bc-runner`, while every consumer (including
  # bc-test-from-source.yml's `runner_image` default and downstream projects
  # like bc-copilot-blueprint) pulled `stefanmaron/msdyn365bc.on.linux/bc-runner`.
  # Result: every push to this workflow built and tagged a fresh image that
  # nobody used, while the image people actually pulled stayed frozen for
  # weeks. A multi-day debugging session traced an entrypoint fix that was
  # silently invisible to every CI run because of this mismatch. Don't move
  # this without simultaneously updating bc-test-from-source.yml and any
  # downstream consumer.
  #
  # The OWNER half follows whoever runs the workflow, because a fork's
  # GITHUB_TOKEN cannot write to another account's GHCR namespace: hardcoding
  # `stefanmaron` here meant every push to a fork's master built the image
  # successfully and then failed on push, leaving a permanently red workflow that
  # makes real failures easy to miss. The PATH half is unchanged and must stay
  # that way for the reason above. Set the `GHCR_OWNER` repository variable to
  # publish somewhere other than your own namespace.
  IMAGE_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  IMAGE_PATH: msdyn365bc.on.linux/bc-runner

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # GHCR rejects uppercase repository names, and github.repository_owner
    # preserves the case the account was registered with (e.g. "SShadowS"), so it
    # cannot be interpolated into an image ref directly.
    - name: Resolve image name
      id: img
      run: echo "name=$REGISTRY/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_PATH" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Dockerfile
        push: true
        tags: |
          ${{ steps.img.outputs.name }}:latest
          ${{ steps.img.outputs.name }}:${{ github.sha }}
        # Registry-backed layer cache for this workflow's own rebuilds.
        # test-versions.yml's build job deliberately does NOT share it: that
        # job has to work on fork PRs, which have no registry write access,
        # so it caches to type=gha instead.
        cache-from: type=registry,ref=${{ steps.img.outputs.name }}:cache
        cache-to: type=registry,ref=${{ steps.img.outputs.name }}:cache,mode=max
