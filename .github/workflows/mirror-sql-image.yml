name: Mirror SQL Server image to GHCR

# Copies mcr.microsoft.com/mssql/server:2022-latest into GHCR so CI runs
# don't have to pull it from mcr.
#
# Why this exists: measured on a real consumer run (Pageworks #27), the
# 625 MB SQL image took ~105s to pull from mcr — about 6 MB/s — while BC
# artifacts downloaded from Azure Front Door at 34 MB/s in the same
# window. That made the SQL pull the binding constraint of the whole
# "download artifacts + pull images" phase. mcr also intermittently
# WAF-blocks GitHub runner IPs, which is why the reusable workflows wrap
# `docker compose pull` in a 5-attempt retry loop.
#
# The digest is compared before pushing, so a scheduled run that finds no
# upstream change costs one manifest request and exits.

on:
  schedule:
    # Weekly, Monday 04:17 UTC. Microsoft publishes mssql CU updates on no
    # fixed cadence; weekly is enough to stay within a few days of latest.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: "Push even when the upstream digest already matches the mirror"
        required: false
        type: boolean
        default: false

env:
  UPSTREAM: mcr.microsoft.com/mssql/server:2022-latest
  # The mirror namespace follows whoever runs this workflow: a fork's
  # GITHUB_TOKEN cannot write to another account's GHCR namespace, so a
  # hardcoded owner meant the mirror built and then failed on push. The tags
  # themselves (:2022, :2022-zstd, :2022-fts) are unchanged -- consumers select
  # them via BC_SQL_IMAGE. Set the GHCR_OWNER repository variable to publish
  # somewhere other than your own namespace.
  #
  # MIRROR / MIRROR_ZSTD / MIRROR_FTS are assembled from this in the first job
  # step and exported to $GITHUB_ENV, because GHCR rejects uppercase repository
  # names and github.repository_owner preserves registration case.
  GHCR_NS: ${{ vars.GHCR_OWNER || github.repository_owner }}
  MIRROR_TAG: "2022"
  # Same image content, layers recompressed with zstd instead of the
  # gzip blobs mcr ships. Pulling 625 MB from GHCR still took ~45s on a
  # private repo's 2-vCPU runner — GHCR shouldn't be network-limited
  # there, which points at gzip inflate on two cores. zstd decompresses
  # several times faster for a similar ratio. Published alongside the
  # byte-identical :2022 tag so there's an instant rollback if a
  # consumer's Docker can't handle zstd layers.
  # (value assembled in the "Resolve mirror namespace" step)
  # Same image plus the SQL Server Full-Text Search component. No official
  # SQL Server Linux image ships FTS — it's a separate mssql-server-fts
  # package — so AL's `OptimizeForTextSearch = true` cannot be installed on
  # the stock stack (issue #20). This variant is OPT-IN via BC_SQL_IMAGE and
  # deliberately NOT the compose default: FTS adds ~550 MB (1.68 GB → 2.23 GB
  # uncompressed, measured), and the SQL pull is on the critical path of every
  # CI run. Only pay for it if your apps need it.

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Must be the FIRST step: every later step reads MIRROR / MIRROR_ZSTD /
      # MIRROR_FTS from the environment.
      - name: Resolve mirror namespace
        run: |
          ns=$(printf '%s' "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/$ns/msdyn365bc.on.linux/mssql"
          {
            echo "MIRROR=$base:$MIRROR_TAG"
            echo "MIRROR_ZSTD=$base:$MIRROR_TAG-zstd"
            echo "MIRROR_FTS=$base:$MIRROR_TAG-fts"
            echo "MIRROR_LATEST=$base:$MIRROR_TAG-latest"
          } >> "$GITHUB_ENV"
          echo "Mirroring into the '$ns' namespace"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare digests
        id: compare
        run: |
          set -uo pipefail

          # Compare the IMAGE digests, not the top-level tag digests.
          # mcr publishes mssql/server as a bare single manifest, while
          # `imagetools create` always writes a manifest LIST — even when
          # copying one source. The mirror therefore ends up as a
          # one-entry list wrapping the identical image, and its top-level
          # digest can never equal upstream's by construction. Comparing
          # those directly made the first run report a false mismatch.
          #
          # So: resolve each tag to the set of image digests it actually
          # points at — child digests for a list, the manifest's own
          # digest for a bare manifest — and compare those.
          # The jq filter drops attestation/provenance entries, which carry
          # the synthetic "unknown/unknown" platform and aren't the image.
          effective_digests() {
            local ref="$1" raw
            raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null) || return 1
            if jq -e 'has("manifests")' >/dev/null <<<"$raw"; then
              jq -r '[.manifests[] | select(.platform.os != "unknown") | .digest] | sort | join(",")' <<<"$raw"
            else
              docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref"
            fi
          }

          up=$(effective_digests "$UPSTREAM") || up=""
          if [ -z "$up" ]; then
            echo "ERROR: could not read the upstream manifest for $UPSTREAM"
            exit 1
          fi
          # A missing mirror is the expected state on the very first run —
          # empty, so the comparison below decides to push.
          mir=$(effective_digests "$MIRROR") || mir=""
          echo "upstream image(s): $up"
          echo "mirror image(s):   ${mir:-<not published yet>}"

          # The zstd tag is what docker-compose.yml actually defaults to,
          # so its presence is checked independently. Otherwise a run
          # where the gzip copy succeeded and the zstd build failed would
          # report "already current" forever, leaving every consumer on a
          # stale SQL image with nothing flagging it. Existence is the
          # test, not digest equality — recompressed layers necessarily
          # hash differently from the gzip originals.
          zstd_present=no
          if docker buildx imagetools inspect --raw "$MIRROR_ZSTD" >/dev/null 2>&1; then
            zstd_present=yes
          fi
          echo "zstd tag present:  $zstd_present"

          # Same reasoning for the FTS variant — it's an opt-in tag, so a
          # silently-missing one would only surface as issue #20 all over
          # again for the consumer who switched to it.
          fts_present=no
          if docker buildx imagetools inspect --raw "$MIRROR_FTS" >/dev/null 2>&1; then
            fts_present=yes
          fi
          echo "fts tag present:   $fts_present"

          if [ "$up" = "$mir" ] && [ "$zstd_present" = "yes" ] && [ "$fts_present" = "yes" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Mirror is already current — nothing to do."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "digest=$up" >> "$GITHUB_OUTPUT"

      # `imagetools create` copies the manifest and its layers registry-to-
      # registry without pulling them onto the runner's disk, so this stays
      # fast regardless of image size. It also preserves the multi-arch
      # index rather than flattening to whatever the runner's platform is.
      - name: Copy image to GHCR
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          docker buildx imagetools create \
            --tag "$MIRROR" \
            --tag "$MIRROR_LATEST" \
            "$UPSTREAM"

      - name: Verify the mirror serves the same image
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          # Same image-digest comparison as the compare step — see the
          # comment there for why the top-level tag digests differ.
          got=$(docker buildx imagetools inspect --raw "$MIRROR" \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | .digest] | sort | join(",")')
          want='${{ steps.compare.outputs.digest }}'
          if [ "$got" != "$want" ]; then
            echo "ERROR: mirror serves image(s) $got, upstream has $want"
            exit 1
          fi
          echo "Mirror published: $MIRROR -> $got"

      # ── zstd variant ────────────────────────────────────────────────
      # buildx re-exports the same filesystem layers with a different
      # compressor. force-compression is required — without it buildx
      # passes the existing gzip blobs through untouched. provenance and
      # sbom are off so the tag stays a plain image rather than gaining
      # attestation manifests that consumers' Docker would have to skip.
      - name: Set up Buildx
        if: steps.compare.outputs.push == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Republish with zstd layers
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          echo "FROM $UPSTREAM" > Dockerfile.mirror
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output "type=registry,name=$MIRROR_ZSTD,compression=zstd,compression-level=9,force-compression=true" \
            -f Dockerfile.mirror .

      # ── Full-Text Search variant ────────────────────────────────────
      # Adds mssql-server-fts on top of the mirrored image so apps using
      # AL's `OptimizeForTextSearch = true` can be installed (issue #20).
      # The Microsoft package repo isn't configured inside the SQL image,
      # so it has to be added before the package resolves — installing
      # mssql-server-fts against the stock sources.list fails with
      # "Unable to locate package".
      #
      # Opt-in only. See the MIRROR_FTS comment above for why it isn't the
      # compose default.
      - name: Build the Full-Text Search variant
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          # Extract the FTS package payload instead of `apt-get install`ing it.
          #
          # The base image ships SQL Server WITHOUT registering it in dpkg, so
          # apt considers mssql-server "not installed" and pulls it in as a
          # dependency of mssql-server-fts — reinstalling the whole ~1.2 GB
          # engine on top of byte-identical files. The overlay filesystem then
          # copies every one of those files up into the new layer. Measured:
          # a 1.93 GB layer of which only ~410 MB (sqlservr.fts.sfp) was new.
          #
          # `apt-get download` + `dpkg-deb -x` takes the FTS payload alone and
          # skips dependency resolution entirely. 1.93 GB layer -> 586 MB,
          # total image 3.61 GB -> 2.23 GB. The engine finds sqlservr.fts.sfp
          # on its own at startup; there is no postinst step that matters,
          # which the functional check below proves rather than assumes.
          cat > Dockerfile.fts <<'EOF'
          FROM mcr.microsoft.com/mssql/server:2022-latest
          USER root
          RUN set -eux; \
              apt-get update; \
              apt-get install -y --no-install-recommends curl gnupg ca-certificates; \
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
                | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg; \
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/mssql-server-2022 jammy main" \
                > /etc/apt/sources.list.d/mssql-server-2022.list; \
              apt-get update; \
              cd /tmp; \
              apt-get download mssql-server-fts; \
              dpkg-deb -x mssql-server-fts_*.deb /; \
              rm -f mssql-server-fts_*.deb; \
              apt-get purge -y curl gnupg; apt-get autoremove -y; \
              apt-get clean; \
              rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/mssql-server-2022.list
          USER mssql
          EOF
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output "type=registry,name=$MIRROR_FTS,compression=zstd,compression-level=9,force-compression=true" \
            -f Dockerfile.fts .

      # Prove FTS is actually active rather than just installed — a
      # published tag that still reports IsFullTextInstalled=0 would fail
      # exactly the same way the stock image does, just 2 GB slower.
      - name: Verify Full-Text Search is active
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          docker pull -q "$MIRROR_FTS"
          docker run -d --name fts-verify \
            -e ACCEPT_EULA=Y -e SA_PASSWORD='Passw0rd123!' -e MSSQL_PID=Developer \
            "$MIRROR_FTS"
          for i in $(seq 1 60); do
            if docker exec fts-verify /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P 'Passw0rd123!' -C -No -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          got=$(docker exec fts-verify /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U sa -P 'Passw0rd123!' -C -No -h -1 -W \
                  -Q "SET NOCOUNT ON; SELECT CONVERT(varchar,SERVERPROPERTY('IsFullTextInstalled'))" \
                | tr -d '[:space:]')
          echo "IsFullTextInstalled = $got"
          if [ "$got" != "1" ]; then
            docker rm -f fts-verify >/dev/null 2>&1 || true
            echo "ERROR: $MIRROR_FTS does not have Full-Text Search active."
            exit 1
          fi

          # SERVERPROPERTY alone only proves the component is present. Since
          # the image extracts the package payload without running its
          # postinst, actually build a full-text index and query it — that is
          # the operation BC performs for OptimizeForTextSearch, and it is the
          # only check that would catch a missing registration step.
          out=$(docker exec fts-verify /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U sa -P 'Passw0rd123!' -C -No -Q "
          CREATE DATABASE ftsverify;
          GO
          USE ftsverify;
          CREATE TABLE t (id INT NOT NULL CONSTRAINT PK_t PRIMARY KEY, txt NVARCHAR(200));
          INSERT INTO t VALUES (1, N'business central on linux');
          CREATE FULLTEXT CATALOG ftcat AS DEFAULT;
          CREATE FULLTEXT INDEX ON t(txt) KEY INDEX PK_t;
          GO
          WAITFOR DELAY '00:00:10';
          SELECT 'FTSMATCH=' + CONVERT(varchar,id) FROM t WHERE CONTAINS(txt, 'linux');
          GO" 2>&1)
          docker rm -f fts-verify >/dev/null 2>&1 || true
          echo "$out"
          if ! echo "$out" | grep -q "FTSMATCH=1"; then
            echo "ERROR: $MIRROR_FTS could not create or query a full-text index."
            exit 1
          fi
          echo "Full-text index created and queried successfully."

      # Pull it back on a clean daemon state to prove a consumer can, and
      # to record what it costs. A failure here means the zstd tag is
      # unusable and consumers should stay on :2022 — which is why the
      # compose default doesn't point at this tag until it's proven.
      - name: Pull the zstd tag back and time it
        if: steps.compare.outputs.push == 'true'
        run: |
          set -e
          docker image rm -f "$MIRROR_ZSTD" >/dev/null 2>&1 || true
          for tag in "$MIRROR" "$MIRROR_ZSTD"; do
            docker image rm -f "$tag" >/dev/null 2>&1 || true
            start=$(date +%s)
            docker pull -q "$tag" >/dev/null
            echo "$tag pulled in $(( $(date +%s) - start ))s"
          done
          echo "NOTE: this runner is a PUBLIC-repo 4-vCPU box ($(nproc) cores)."
          echo "      The gzip-vs-zstd gap should be wider on a private"
          echo "      repo's 2-vCPU runner, which is where it matters."

      - name: Summary
        run: |
          {
            echo "### SQL Server image mirror"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream | \`$UPSTREAM\` |"
            echo "| Mirror (gzip, byte-copy) | \`$MIRROR\` |"
            echo "| Mirror (zstd layers) | \`$MIRROR_ZSTD\` |"
            echo "| Mirror (zstd + Full-Text Search, opt-in) | \`$MIRROR_FTS\` |"
            echo "| Digest | \`${{ steps.compare.outputs.digest }}\` |"
            echo "| Pushed | ${{ steps.compare.outputs.push }} |"
          } >> "$GITHUB_STEP_SUMMARY"
