# Diagnostic probe: can a booted BC service tier survive CRIU checkpoint/restore?
#
# WHY THIS EXISTS
# ---------------
# With the caches described in CLAUDE.md, a warm boot is ~90s and ~80s of that
# is NST startup. Tiering and skipping Merkle validation were both measured and
# rejected (see PERFORMANCE-IDEAS.md), so the only remaining lever on that 80s
# is to not run startup at all: checkpoint a booted NST and restore the image.
#
# WHAT THIS PROVES, AND WHAT IT DOES NOT
# --------------------------------------
# This runs on a GitHub-hosted runner, which is ephemeral — so it CANNOT show
# the wall-clock win, which only exists on a runner that keeps the checkpoint
# between jobs. It tests the prerequisite: does BC come back alive at all.
#
# It also tests the EASY variant. Restore happens in the same job against the
# SAME still-running SQL container, so the ~17 pooled TCP connections have a
# live peer with matching sequence numbers. The case that actually matters —
# restoring against a FRESH SQL container in a later job — is strictly harder.
# A pass here is necessary, not sufficient. A failure here ends the design.
#
# It is a full BC boot plus a checkpoint cycle — several minutes of runner
# time — so it is triggered narrowly: see the `on:` block below.
name: Probe CRIU checkpoint/restore (diagnostic)

# The push trigger exists so this can run at all right now: workflow_dispatch
# only registers for workflows on the DEFAULT branch, and this file is on a
# feature branch. Push has no such rule.
#
# Scoped to this branch AND to this file, so it fires when the probe itself
# changes and not on unrelated pushes — test-versions.yml already demonstrated
# what an unfiltered trigger costs in this repo. Delete this `push:` block once
# the probe has told you what you need; it is scaffolding, not a fixture.
# Push trigger re-armed for ONE experiment: run 9 proved criu dumps BC fine and
# only docker's netns rebuild fails, so this tests the same thing with
# `network_mode: host` — no network namespace, nothing for docker to rebuild.
# Strip this block again once it has answered.
on:
  push:
    branches: [claude/hosted-runner-performance-42ljw4]
    paths: ['.github/workflows/probe-criu.yml']
  workflow_dispatch:
    inputs:
      bc_version:
        description: "BC version to boot"
        required: false
        type: string
        default: "28.1"
      bc_country:
        description: "BC country"
        required: false
        type: string
        default: "w1"
      verify_publish:
        description: >
          After restore, compile and publish a NOVEL app to prove the tenant
          survived. A boot check alone is not a pass — Patch #30 passed one and
          was still catastrophic. Costs ~2 min.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# A newer push supersedes an in-flight probe: each run is a full BC boot, and
# an older run finishing later would report on superseded code.
concurrency:
  group: probe-criu
  cancel-in-progress: true

jobs:
  probe:
    # The blocker in runs 5 and 6 was the KERNEL (criu could not parse the vDSO
    # on 6.17-azure), and the only way to choose a kernel on hosted runners is
    # the runner label. ubuntu-22.04 is older AND ships criu in universe, so it
    # tests a different criu against a different kernel. fail-fast off: each leg
    # is an independent answer, and the gate now fails in ~3 min when criu
    # cannot initialise.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (6.17-azure) is REMOVED, not forgotten: criu 4.0 and the
        # newest tag both fail there parsing their own vDSO
        # (kerndat_vdso_fill_symtable), so the leg costs 3 minutes to learn
        # nothing. 22.04 (6.8-azure) has criu in apt and reaches the checkpoint.
        runner: [ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # `inputs.*` is empty when this runs from the push trigger, so each one
      # falls back to the same default declared above.
      BC_VERSION: ${{ inputs.bc_version || '28.1' }}
      BC_COUNTRY: ${{ inputs.bc_country || 'w1' }}
      BC_TYPE: sandbox
      # Default TRUE on push: the strict check is the point of the probe, and a
      # boot check alone is not evidence (see Patch #30).
      VERIFY_PUBLISH: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.verify_publish }}
      BC_ARTIFACTS_DIR: ${{ github.workspace }}/artifact-cache
      # THE criu VERSION WAS THE WHOLE BLOCKER. Runs 14-16: jammy's packaged
      # 3.17 (2022) dumps BC fine and then segfaults the restored task, with no
      # criu diagnostic beyond "killed by signal 11". Building v4.2.1 from
      # source, changing nothing else, restored BC to a serving OData endpoint.
      # Pinned rather than "latest" so the next experiment has one variable.
      # v4.0 predates this kernel and fails differently (run 5).
      CRIU_REF: v4.2.1
      # Run 9 restored into: bind-mount /proc/0/ns/net -> ...: no such file or
      # directory. That is libnetwork re-attaching the container's sandbox by
      # bind-mounting /proc/<init-pid>/ns/net, except on restore the init
      # process does not exist yet, so the pid is 0. Host networking removes the
      # namespace entirely, so there is nothing to rebuild.
      HOST_NETWORK: "true"
      # busybox -> .NET -> BC ladder, ~60s before the BC boot. Written to tell a
      # BC-specific restore failure apart from "criu cannot restore .NET here",
      # which was the open question through run 15. Run 16 answered it (criu
      # version), so this is off by default -- turn it on the next time a restore
      # breaks and you need to know whether BC is even implicated.
      RUN_CONTROLS: "false"
      # glibc 2.35 registers an rseq area per thread and a mis-restored one
      # segfaults the resumed task, which is what runs 14-16 looked like. It was
      # NOT the cause: criu 4.2.1 restores BC with rseq left on. Kept as a lever
      # rather than deleted, but off -- do not perturb a working configuration.
      RSEQ_OFF: "false"
      # THE question run 16 leaves open. Restore there had the same SQL container
      # alive the whole time, so BC's ~17 pooled connections had a live peer.
      # This severs them: sql is restarted between checkpoint and restore, so the
      # restored NST wakes up holding handles to sockets whose peer is gone. That
      # is the case CI actually needs, and it is strictly harder.
      RESTART_SQL_BEFORE_RESTORE: "true"

    steps:
      - uses: actions/checkout@v4

      # ── Gate 1: does the runner kernel support checkpoint/restore? ────────
      # This is what stopped the probe being run locally: a Firecracker microVM
      # kernel had CONFIG_CHECKPOINT_RESTORE unset, which makes CRIU impossible
      # at any privilege level. Stock Ubuntu has it. Verify, don't assume.
      - name: Kernel + CRIU availability
        id: gate
        run: |
          set +e
          echo "kernel: $(uname -r)"
          CFG=/boot/config-$(uname -r)
          if [ -f "$CFG" ]; then
            grep -E "^CONFIG_CHECKPOINT_RESTORE|^# CONFIG_CHECKPOINT_RESTORE" "$CFG" || echo "CONFIG_CHECKPOINT_RESTORE: absent from $CFG"
          else
            echo "no $CFG on this runner"
          fi
          # Run 1 died here: kernel had CONFIG_CHECKPOINT_RESTORE=y but
          # `apt-get install criu` reported no installation candidate on
          # ubuntu-24.04. So: diagnose, try enabling universe, and fall back to
          # building from source. The kernel is the part that cannot be worked
          # around, and it is already confirmed good.
          echo "--- apt visibility of criu ---"
          apt-cache policy criu || true
          grep -rhoP '^deb .*ubuntu.com/ubuntu/? \K\S+ .*' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | head -5 || true
          grep -rl "Components:" /etc/apt/sources.list.d/ 2>/dev/null | head -2 | xargs -r grep -H "Components:" || true

          sudo add-apt-repository -y universe >/dev/null 2>&1 || true
          sudo apt-get update -qq
          # jammy packages criu 3.17 (2022). rseq support landed in that very
          # release and has been fixed repeatedly since; glibc 2.35 registers
          # rseq on every thread, and a mismatched rseq area segfaults a restored
          # task exactly the way runs 14 and 15 did. So prefer source unless
          # CRIU_FROM_SOURCE is turned off.
          if [ "${CRIU_FROM_SOURCE:-true}" != "true" ] && sudo apt-get install -y -qq criu; then
            echo "criu: installed from apt ($(criu --version 2>&1 | head -1))"
          else
            echo "::warning::criu not in apt on this runner — building ${CRIU_REF} from source"
            sudo apt-get install -y -qq build-essential git pkg-config \
              libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler \
              python3-protobuf libnl-3-dev libnet-dev libcap-dev libbsd-dev \
              libgnutls28-dev libnftables-dev iproute2 asciidoc xmlto
            REF="$CRIU_REF"
            if [ "$REF" = "latest" ]; then
              # criu publishes TAGS, not GitHub Releases -- /releases/latest 404s.
              # Run 6 silently fell back to v4.0 and repeated a known failure, so
              # an unresolvable tag is now fatal rather than a quiet downgrade.
              REF=$(curl -fsSL "https://api.github.com/repos/checkpoint-restore/criu/tags?per_page=100" \
                    | grep -oP '"name":\s*"\Kv?[0-9]+\.[0-9]+(\.[0-9]+)?(?=")' \
                    | sort -V | tail -1)
              [ -n "$REF" ] || { echo "::error::could not resolve a criu tag"; exit 1; }
              echo "resolved newest criu tag: $REF (from tags API, not releases)"
            fi
            git clone --depth 1 --branch "$REF" https://github.com/checkpoint-restore/criu.git /tmp/criu
            make -C /tmp/criu -j"$(nproc)" 2>&1 | tail -15
            sudo make -C /tmp/criu install-criu
            command -v criu || sudo ln -sf /usr/local/sbin/criu /usr/sbin/criu
          fi
          # Hard gate. Run 1 let this pass and everything downstream then measured a
          # BC that had never been checkpointed.
          command -v criu >/dev/null || { echo "::error::criu unavailable — probe cannot mean anything"; exit 1; }
          criu --version || sudo criu --version
          echo "--- criu check ---"
          # NOT informational. Run 5 printed exit 1 here (vDSO/kerndat init
          # failure on kernel 6.17) and the probe went on to boot BC for two
          # minutes before failing at the checkpoint for that same reason.
          if ! sudo criu check 2>&1 | tee criu-check.out; then :; fi
          if grep -qE 'kerndat|vdso|Could not initialize kernel features' criu-check.out; then
            {
              echo "### criu cannot initialise on this kernel"
              echo '```'; tail -12 criu-check.out; echo '```'
              echo "kernel: \`$(uname -r)\`, criu: \`$(criu --version 2>&1 | head -1)\`"
              echo
              echo "This is a criu/kernel incompatibility on the runner image, **not**"
              echo "a finding about Business Central. Nothing was checkpointed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::criu cannot initialise on kernel $(uname -r) — probe cannot proceed"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # ── Gate 2: docker checkpoint needs the experimental daemon flag ──────
      - name: Enable docker experimental
        run: |
          echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          echo "experimental: $(docker info --format '{{.ExperimentalBuild}}')"
          docker checkpoint --help >/dev/null 2>&1 \
            && echo "docker checkpoint: available" \
            || echo "::warning::docker checkpoint subcommand unavailable"

      # criu's runtime configuration, hoisted out of the checkpoint step so the
      # control ladder below runs under EXACTLY the settings BC will get. Each
      # option was unlocked by a specific failed run; see the checkpoint step.
      - name: CRIU runtime configuration
        run: |
          set -e
          sudo sysctl -w vm.overcommit_memory=1 vm.max_map_count=1048576
          free -g | awk 'NR==2{print "  host RAM used/total: "$3"/"$2" GB"}'
          sudo mkdir -p /etc/criu /tmp/criu-work && sudo chmod 777 /tmp/criu-work
          printf 'tcp-established\ntcp-close\nfile-locks\next-unix-sk\nlink-remap\nghost-limit 512M\nwork-dir /tmp/criu-work\nlog-file criu.log\n' \
            | sudo tee /etc/criu/runc.conf

      # ── Gate 3: does checkpoint/restore work on this runner AT ALL? ───────
      # Runs 7-16 only ever exercised BC, so a restore SIGSEGV had two possible
      # readings and no way to tell them apart: docker+criu is broken on hosted
      # runners, or BC specifically is. This ladder separates them for ~60s,
      # BEFORE the three minutes of BC boot:
      #
      #   busybox  -- plain process, one thread. Fails => nothing about BC.
      #   dotnet   -- .NET 8 runtime: JIT'd code, W^X double mapping, a GC
      #               reserving huge virtual ranges, dozens of threads, rseq.
      #               Fails => the blocker is .NET on criu, not this project's
      #               patches, and no BC-side change can help.
      #   BC       -- everything above plus 263 GB of reservations, ~17 pooled
      #               SQL connections, and our JMP hooks.
      #
      # Whichever rung breaks first IS the answer. Not fatal: a broken rung is
      # the finding, so let BC run anyway and report the whole ladder.
      - name: Control checkpoint/restore ladder
        id: controls
        if: ${{ env.RUN_CONTROLS == 'true' }}
        continue-on-error: true
        run: |
          set -u
          # Mirrored to a file so the Verdict step can put the ladder in the run
          # summary. A separate step reads it, so the async tee has exited by then.
          exec > >(tee /tmp/ladder.out) 2>&1
          echo "dotnet on runner: $(command -v dotnet || echo NONE) $(dotnet --version 2>/dev/null || true)"
          # $1 name, $2 image, $3... command. Emits one verdict line per rung.
          rung() {
            local name=$1 image=$2; shift 2
            local cn="ctl-$name" verdict
            docker rm -f "$cn" >/dev/null 2>&1 || true
            # Host networking, to match how bc is launched (see HOST_NETWORK).
            docker run -d --name "$cn" --network host "$image" "$@" >/dev/null 2>&1 \
              || { echo "RUNG $name: SKIP (container would not start)"; return; }
            sleep 10
            [ "$(docker inspect -f '{{.State.Status}}' "$cn")" = running ] \
              || { echo "RUNG $name: SKIP (died before checkpoint)"; docker logs --tail 5 "$cn" 2>&1; return; }
            if ! docker checkpoint create --leave-running=false "$cn" c 2>"/tmp/$name.dump.err"; then
              echo "RUNG $name: DUMP FAILED"; sed -n 1,3p "/tmp/$name.dump.err"
              sudo grep -hE 'Error \(' /tmp/criu-work/criu.log 2>/dev/null | tail -3
              docker rm -f "$cn" >/dev/null 2>&1; return
            fi
            if ! docker start --checkpoint c "$cn" 2>"/tmp/$name.res.err"; then
              echo "RUNG $name: RESTORE FAILED"; sed -n 1,3p "/tmp/$name.res.err"
              sudo grep -hE 'Error \(|killed by signal' /tmp/criu-work/criu.log 2>/dev/null | tail -4
              docker rm -f "$cn" >/dev/null 2>&1; return
            fi
            # `docker start` returning 0 is not proof of life -- assert the
            # process is still running a few seconds later, the same way the BC
            # steps refuse to trust an exit code alone.
            sleep 5
            verdict=$(docker inspect -f '{{.State.Status}}' "$cn")
            [ "$verdict" = running ] \
              && echo "RUNG $name: RESTORED AND ALIVE" \
              || { echo "RUNG $name: RESTORED THEN DIED ($verdict)"; docker logs --tail 5 "$cn" 2>&1; }
            docker rm -f "$cn" >/dev/null 2>&1 || true
          }

          rung busybox busybox:latest sh -c 'i=0; while :; do i=$((i+1)); sleep 1; done'

          # Framework-dependent build on the runner, run in the runtime image:
          # ~80 MB pull and no in-container SDK. The workload matters -- it must
          # be allocating and JIT-ing at checkpoint time, not parked in a syscall,
          # or it proves far less than it looks like it does.
          mkdir -p /tmp/ctlapp && cd /tmp/ctlapp
          cat > ctlapp.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <AssemblyName>ctlapp</AssemblyName>
            </PropertyGroup>
          </Project>
          CSPROJ
          cat > Program.cs <<'CS'
          using System.Diagnostics;
          var sw = Stopwatch.StartNew();
          for (int t = 0; t < 8; t++)
              new Thread(() => { var r = new Random(); long acc = 0;
                  while (true) { var b = new byte[64 * 1024]; r.NextBytes(b); acc += b[0];
                      if (acc % 1000 == 0) GC.Collect(0); Thread.Sleep(1); } }) { IsBackground = true }.Start();
          while (true) { Console.WriteLine($"alive {sw.Elapsed.TotalSeconds:F0}s"); Thread.Sleep(2000); }
          CS
          if dotnet publish -c Release -o out --nologo -v q >/dev/null 2>&1; then
            cd "$GITHUB_WORKSPACE"
            docker rm -f ctl-dotnet >/dev/null 2>&1 || true
            [ "${RSEQ_OFF:-false}" = "true" ] && TUNABLES=glibc.pthread.rseq=0 || TUNABLES=
            docker run -d --name ctl-dotnet --network host \
              -v /tmp/ctlapp/out:/app:ro -w /app \
              -e DOTNET_EnableWriteXorExecute=0 \
              -e GLIBC_TUNABLES="$TUNABLES" \
              mcr.microsoft.com/dotnet/runtime:8.0 dotnet /app/ctlapp.dll >/dev/null 2>&1 || true
            sleep 10
            if [ "$(docker inspect -f '{{.State.Status}}' ctl-dotnet 2>/dev/null)" = running ]; then
              if ! docker checkpoint create --leave-running=false ctl-dotnet c 2>/tmp/dotnet.dump.err; then
                echo "RUNG dotnet: DUMP FAILED"; sed -n 1,3p /tmp/dotnet.dump.err
              elif ! docker start --checkpoint c ctl-dotnet 2>/tmp/dotnet.res.err; then
                echo "RUNG dotnet: RESTORE FAILED"; sed -n 1,3p /tmp/dotnet.res.err
                sudo grep -hE 'Error \(|killed by signal' /tmp/criu-work/criu.log 2>/dev/null | tail -4
              else
                sleep 5
                if [ "$(docker inspect -f '{{.State.Status}}' ctl-dotnet)" = running ]; then
                  echo "RUNG dotnet: RESTORED AND ALIVE"
                  echo "  post-restore output: $(docker logs --tail 2 ctl-dotnet 2>&1 | tr '\n' ' ')"
                else
                  echo "RUNG dotnet: RESTORED THEN DIED"
                  docker logs --tail 5 ctl-dotnet 2>&1
                fi
              fi
            else
              echo "RUNG dotnet: SKIP (container not running before checkpoint)"
            fi
            docker rm -f ctl-dotnet >/dev/null 2>&1 || true
          else
            echo "RUNG dotnet: SKIP (publish failed)"
          fi
          cd "$GITHUB_WORKSPACE"

      - name: Host networking (removes the netns docker cannot rebuild)
        if: ${{ env.HOST_NETWORK == 'true' }}
        run: |
          # Left as a compose interpolation, not expanded by this shell, so the
          # value has to exist in the environment of every later compose call.
          [ "${RSEQ_OFF:-false}" = "true" ] && V=glibc.pthread.rseq=0 || V=
          echo "GLIBC_TUNABLES_VALUE=$V" >> "$GITHUB_ENV"
          echo "GLIBC_TUNABLES for bc: '${V:-<unset>}'"
          # COMPOSE_FILE means every later bare `docker compose` picks this up
          # without touching the steps themselves.
          cat > override-host.yml <<'YAML'
          services:
            bc:
              network_mode: host
              environment:
                SQL_SERVER: localhost
                # Run 14 restored the mappings (ENOMEM gone once overcommit was
                # relaxed) and then segfaulted on resume. .NET 8 defaults W^X ON,
                # which double-maps executable memory -- one RW view and one RX
                # view over the same memfd. That pairing is a known CRIU sore
                # point: restore them wrongly and the first instruction fetched
                # is garbage, which is exactly a SIGSEGV on resume with no
                # managed frames. Turning it off costs a little JIT throughput
                # and nothing else.
                DOTNET_EnableWriteXorExecute: "0"
                # See RSEQ_OFF at the job level for why. Empty when disabled,
                # which glibc treats the same as unset.
                GLIBC_TUNABLES: "${GLIBC_TUNABLES_VALUE}"
          YAML
          echo "COMPOSE_FILE=docker-compose.yml:override-host.yml" >> "$GITHUB_ENV"
          # bridge DNS ("sql") is gone with host networking, so BC reaches SQL on
          # the published port; 1433 keeps the default so no connection string
          # needs a port suffix.
          echo "SQL_PORT=1433" >> "$GITHUB_ENV"
          echo "bc will run with host networking, SQL_SERVER=localhost, sql published on 1433"

      - name: Fetch BC artifacts and images
        run: |
          set -e
          mkdir -p "$BC_ARTIFACTS_DIR"
          bash scripts/download-artifacts.sh "$BC_TYPE" "$BC_VERSION" "$BC_COUNTRY" "$BC_ARTIFACTS_DIR" &
          DL=$!
          bash scripts/compose-pull.sh &
          PULL=$!
          wait $DL   || { echo "::error::artifact download failed"; exit 1; }
          wait $PULL || { echo "::error::image pull failed"; exit 1; }

      - name: Boot BC (cold) and time it
        id: boot
        run: |
          set -e
          T0=$(date +%s)
          docker compose up -d --wait
          T1=$(date +%s)
          echo "cold_boot=$((T1-T0))" >> "$GITHUB_OUTPUT"
          echo "cold boot to healthy: $((T1-T0))s"
          CID=$(docker compose ps -q bc)
          echo "cid=$CID" >> "$GITHUB_OUTPUT"
          docker compose exec -T bc sh -c '
            for p in /proc/[0-9]*; do
              tr "\0" " " < $p/cmdline 2>/dev/null | grep -q "Nav.Server.dll" && PID=${p#/proc/} && break
            done
            awk "/^VmRSS/{printf \"NST RSS: %.2f GB\n\", \$2/1048576}" /proc/$PID/status
            awk "/^Private_Dirty/{s+=\$2} END{printf \"NST private dirty (checkpoint payload): %.2f GB\n\", s/1048576}" /proc/$PID/smaps'

      # ── The probe itself ──────────────────────────────────────────────────
      # KNOWN RISK: `docker checkpoint create` does not expose CRIU's
      # --tcp-established. BC holds ~17 pooled connections to SQL, and CRIU
      # refuses to dump established TCP sockets unless told to. If this step
      # fails complaining about TCP/sockets, that is NOT "BC cannot be
      # checkpointed" — it means the docker-checkpoint route is unusable and
      # the experiment has to drive criu directly (nsenter into the container's
      # namespaces, `criu dump --tcp-established --shell-job`). The error is
      # captured below so the two cases can be told apart.
      - name: Checkpoint the running container
        id: checkpoint
        continue-on-error: true
        run: |
          set -e
          CID="${{ steps.boot.outputs.cid }}"
          T0=$(date +%s)
          # runc invokes criu and reads /etc/criu/runc.conf -- the dump log says
          # "Would overwrite RPC settings with values from /etc/criu/runc.conf".
          # That is the only way to reach --tcp-established, since
          # `docker checkpoint create` exposes no flag for it, and run 7 proved
          # that is the exact wall: BC's ~17 pooled connections to SQL make criu
          # refuse with "Connected TCP socket, consider using --tcp-established".
          # /etc/criu/runc.conf and the sysctls are written by the "CRIU runtime
          # configuration" step above, so the control ladder runs under the same
          # settings. What each option is for:
          # Each option criu asks for unlocks the next barrier, and a run costs
          # ~5 minutes, so set the whole set it typically needs rather than
          # discovering them one per run:
          #   tcp-established  run 7: "Connected TCP socket" (BC's SQL pool)
          #   file-locks       run 8: "Some file locks are hold by dumping tasks"
          #   ext-unix-sk      unix sockets crossing the container boundary
          #   link-remap       files unlinked while still open
          #   ghost-limit      raises the 1 MB cap on deleted-but-open file data
          # This answers "can it dump at all", not "what is the minimal set" --
          # trim later if that matters.
          # Run 12 found NO criu log anywhere: containerd tears the restore task
          # dir down on failure, taking criu-restore.log with it before any find
          # can run. criu takes work-dir/log-file from this same config, so point
          # it somewhere that outlives the container.
          # Run 13's restore died with ENOMEM (-12 shown as 0xfffffffffffffff4)
          # remapping one region. BC's NST has RSS 2.24 GB but VmSize 263 GB --
          # .NET's GC reserves vast virtual ranges. Restoring a quarter-terabyte
          # of address-space reservations is precisely what the heuristic
          # overcommit mode refuses and what exhausts the default 65530 mapping
          # cap, and criu must recreate every one of them.
          echo "criu on PATH: $(command -v criu || echo NONE)"
          echo "dockerd sees: $(sudo docker info 2>/dev/null | grep -iE 'runtime|storage driver' | tr '\n' ' ')"
          if ! docker checkpoint create --leave-running=false "$CID" cp1 2>checkpoint.err; then
            cat checkpoint.err
            # The daemon error only says "criu failed: type DUMP" and points at a
            # log file. THAT file has the actual reason; without it every failure
            # looks the same and classifies as "other".
            DUMPLOG="/run/containerd/io.containerd.runtime.v2.task/moby/$CID/criu-dump.log"
            echo "--- criu-dump.log ---"
            sudo grep -E "Error \(" "$DUMPLOG" 2>/dev/null | tail -15 || sudo tail -40 "$DUMPLOG" 2>/dev/null || echo "(criu-dump.log not found)"
            sudo cp "$DUMPLOG" ./criu-dump.log 2>/dev/null || true
            # Put it where a phone can read it: the run summary, not 1700 log lines.
            {
              echo "### Checkpoint failed"
              echo '```'
              head -c 500 checkpoint.err
              echo '```'
              echo "**criu-dump.log (the actual reason):**"
              echo '```'
              sudo tail -25 ./criu-dump.log 2>/dev/null || echo "(not captured)"
              echo '```'
              echo "criu on PATH: \`$(command -v criu || echo NONE)\`"
            } >> "$GITHUB_STEP_SUMMARY"
            # Must match criu's ACTUAL tcp refusal, not the word "socket".
            # Run 5 matched `sockets: Probing sock diag modules` -- a routine
            # startup line -- and reported a TCP refusal that never happened,
            # while the real cause (vDSO) went unnamed.
            if grep -qiE "established tcp|tcp-established|Connected TCP socket|socket is in TCP_" checkpoint.err ./criu-dump.log 2>/dev/null; then
              echo "::warning::checkpoint refused on established TCP connections — expected; retry via raw criu --tcp-established"
              echo "classification=tcp-sockets" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::checkpoint failed for another reason — see the error above"
              echo "classification=other" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          T1=$(date +%s)
          echo "checkpoint_s=$((T1-T0))" >> "$GITHUB_OUTPUT"
          echo "checkpoint took $((T1-T0))s"
          # Falsifiable: --leave-running=false must have stopped it. Without this
          # assertion a no-op "checkpoint" leaves BC running and every later step
          # passes against a process that was never checkpointed.
          ST=$(docker inspect --format '{{.State.Status}}' "$CID")
          echo "container status after checkpoint: $ST"
          [ "$ST" = "exited" ] || { echo "::error::container still $ST after checkpoint — nothing was checkpointed"; exit 1; }
          sudo du -sh "/var/lib/docker/containers/$CID/checkpoints/cp1" 2>/dev/null \
            || sudo find /var/lib/docker -maxdepth 6 -name cp1 -type d -exec du -sh {} \; 2>/dev/null \
            || echo "(checkpoint dir not located — size unknown)"

      # Run 16 restored BC against the SAME live SQL container, which is the easy
      # case and was never the interesting one: `tcp-close` in runc.conf means
      # criu closes the pooled connections instead of repairing them, so what is
      # actually being tested is whether ADO.NET reconnects on first use after
      # resume. Restarting sql here makes that real -- new sockets, new peer,
      # same data (the tmpfs survives a restart because the container is not
      # recreated). A fully fresh sql container additionally needs the database
      # restored into it, which is the entrypoint's job and does not run on a
      # resumed process; that is a separate experiment.
      - name: Restart SQL so the restored BC has no live peer
        id: sqlrestart
        if: ${{ steps.checkpoint.outcome == 'success' && env.RESTART_SQL_BEFORE_RESTORE == 'true' }}
        run: |
          set -e
          docker compose restart sql
          for i in $(seq 1 60); do
            [ "$(docker compose ps --format '{{.Health}}' sql 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          H=$(docker compose ps --format '{{.Health}}' sql 2>/dev/null)
          echo "sql health after restart: ${H:-unknown}"
          [ "$H" = healthy ] || { echo "::error::sql did not come back — the restore result would be meaningless"; exit 1; }
          # Falsifiable: a restart that preserved the sockets would prove nothing.
          echo "sql container started at: $(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q sql)")"

      - name: Restore from the checkpoint
        id: restore
        if: ${{ steps.checkpoint.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -e
          CID="${{ steps.boot.outputs.cid }}"
          # `docker start` on a RUNNING container returns 0 and does nothing —
          # which is how run 1 reported "restore success, OData 200" in 0s
          # against a BC that had never stopped. Assert the precondition.
          ST=$(docker inspect --format '{{.State.Status}}' "$CID")
          [ "$ST" = "exited" ] || { echo "::error::refusing to 'restore' a container that is $ST"; exit 1; }
          T0=$(date +%s)
          RLOG="/run/containerd/io.containerd.runtime.v2.task/moby/$CID/criu-restore.log"
          if ! docker start --checkpoint cp1 "$CID" 2>restore.err; then
            cat restore.err
            # "type RESTORE errno 0" names no reason -- it is in this file, the
            # restore-side twin of criu-dump.log.
            # Run 11: the assumed path was empty. After --leave-running=false the
            # container is exited, so containerd's task dir is gone or transient.
            # Search instead of assuming -- any criu log touched in the last 5 min.
            echo "--- criu work-dir log: errors ---"
            sudo grep -E "Error \(|Warn \(" /tmp/criu-work/criu.log 2>/dev/null | tail -20 \
              || echo "(no /tmp/criu-work/criu.log)"
            # A bare SIGSEGV carries no criu diagnostic, so the preceding lines
            # are the only clue to what it was restoring when it died.
            echo "--- criu work-dir log: last 25 lines before the crash ---"
            sudo tail -25 /tmp/criu-work/criu.log 2>/dev/null || true
            sudo cp /tmp/criu-work/criu.log ./criu-restore.log 2>/dev/null || true
            echo "--- searching for criu restore logs ---"
            sudo find /run/containerd /var/lib/docker /var/log /tmp -name 'criu*.log' -mmin -5 2>/dev/null | tee found-logs.txt
            while read -r f; do
              [ -n "$f" ] || continue
              echo "--- $f (Error lines) ---"
              sudo grep -E "Error \(" "$f" 2>/dev/null | tail -15 || sudo tail -20 "$f" 2>/dev/null
              sudo cp "$f" "./$(basename "$f")" 2>/dev/null || true
            done < found-logs.txt
            [ -s found-logs.txt ] || echo "(no criu*.log anywhere — checking dockerd journal)"
            [ -s found-logs.txt ] || sudo journalctl -u docker --since '5 min ago' --no-pager 2>/dev/null \
              | grep -iE 'criu|restore' | tail -25 | tee criu-restore.log
            {
              echo "### Restore failed"
              echo '```'
              sudo grep -E "Error \(" ./criu-restore.log 2>/dev/null | tail -10 || head -c 400 restore.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Readiness is OData answering, not the container being "up".
          for i in $(seq 1 180); do
            code=$(docker compose exec -T bc curl -s -o /dev/null -w '%{http_code}' \
                     --max-time 5 -u BCRUNNER:Admin123! \
                     http://localhost:7048/BC/ODataV4/Company 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done
          T1=$(date +%s)
          echo "restore_s=$((T1-T0))" >> "$GITHUB_OUTPUT"
          echo "odata=$code" >> "$GITHUB_OUTPUT"
          echo "restore to OData 200: $((T1-T0))s (last code $code)"

      - name: Post-restore health
        id: health
        continue-on-error: true
        run: |
          set +e
          echo "container: $(docker inspect --format '{{.State.Status}}' ${{ steps.boot.outputs.cid }})"
          docker compose exec -T bc curl -s -o /dev/null -w 'OData  /Company : %{http_code}\n' \
            --max-time 20 -u BCRUNNER:Admin123! http://localhost:7048/BC/ODataV4/Company
          docker compose exec -T bc curl -s -o /dev/null -w 'dev    /apps    : %{http_code}\n' \
            --max-time 20 -u BCRUNNER:Admin123! http://localhost:7049/BC/dev/apps
          echo "--- did the SQL connection pool survive? ---"
          docker compose exec -T bc /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P 'Passw0rd123!' \
            -C -d CRONUS -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [Company];" 2>&1 | head -3
          echo "--- BC log tail since restore ---"
          docker compose logs bc --tail 25 2>&1 | cut -c1-160

      # ── The strict pass condition ─────────────────────────────────────────
      - name: Compile and publish a NOVEL app after restore
        id: publish
        if: ${{ env.VERIFY_PUBLISH == 'true' && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -e
          AL_VER=$(python3 scripts/resolve-al-tool-version.py "$BC_VERSION" --policy matching)
          PKG=microsoft.dynamics.businesscentral.development.tools.linux
          mkdir -p al && curl -fsSL \
            "https://api.nuget.org/v3-flatcontainer/${PKG}/${AL_VER}/${PKG}.${AL_VER}.nupkg" -o al/pkg.zip
          unzip -q -o al/pkg.zip -d al && rm al/pkg.zip
          ALC=$(find al -type f -name alc | sort | tail -1); chmod +x "$ALC"
          mkdir -p symbols
          python3 scripts/stage-symbols.py \
            --app-json extensions/smoke-test/app.json \
            --artifact-dir "$BC_ARTIFACTS_DIR" --out-dir symbols
          "$ALC" /project:"$PWD/extensions/smoke-test" /packagecachepath:"$PWD/symbols" \
                 /out:"$PWD/smoke-test.app"
          docker compose cp smoke-test.app bc:/tmp/smoke-test.app
          docker compose exec -T bc sh -c '
            code=$(curl -s -o /tmp/p.out -w "%{http_code}" --max-time 300 -u BCRUNNER:Admin123! \
              -X POST -F "file=@/tmp/smoke-test.app;type=application/octet-stream" \
              "http://localhost:7049/BC/dev/apps?SchemaUpdateMode=forcesync")
            echo "publish HTTP $code"; head -c 400 /tmp/p.out; echo
            [ "$code" = "200" ]'
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verdict
        if: always()
        run: |
          {
            echo "## CRIU checkpoint/restore probe"
            echo
            echo "Runner: $(nproc) vCPU / $(awk '/MemTotal/{printf "%.0f", $2/1024/1024}' /proc/meminfo) GB, kernel $(uname -r)"
            echo
            echo "| step | result |"
            echo "|---|---|"
            echo "| cold boot to healthy | ${{ steps.boot.outputs.cold_boot }}s |"
            echo "| checkpoint | ${{ steps.checkpoint.outcome }} (${{ steps.checkpoint.outputs.checkpoint_s }}s) |"
            echo "| sql restarted before restore | ${{ steps.sqlrestart.outcome }} |"
            echo "| restore | ${{ steps.restore.outcome }} (${{ steps.restore.outputs.restore_s }}s, OData ${{ steps.restore.outputs.odata }}) |"
            echo "| post-restore health | ${{ steps.health.outcome }} |"
            echo "| novel app publish | ${{ steps.publish.outcome }} |"
            echo
            # The ladder is the part that says whether a BC failure is even about
            # BC, so it belongs in the summary and not 1700 log lines down.
            if [ -s /tmp/ladder.out ]; then
              echo "**Control ladder** (busybox -> .NET -> BC; first broken rung is the answer):"
              echo '```'
              grep -E '^RUNG |^  ' /tmp/ladder.out || cat /tmp/ladder.out
              echo '```'
              echo
            fi
            echo "This runner is ephemeral, so these timings do NOT show the win —"
            echo "that only exists where the checkpoint survives between jobs, and"
            echo "moving a ~2.1 GB checkpoint payload there is its own problem."
            if [ "${{ steps.sqlrestart.outcome }}" = "success" ]; then
              echo "SQL was restarted between checkpoint and restore, so BC resumed with"
              echo "its pooled connections' peer gone. A fully fresh SQL container also"
              echo "needs the database restored into it — still untested."
            else
              echo "Restore had the SAME SQL container alive throughout, which is the"
              echo "easy case; severing those connections is strictly harder."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.checkpoint.outputs.classification }}" = "tcp-sockets" ]; then
            echo "::error::Checkpoint refused on established TCP connections. This does NOT rule out CRIU — docker checkpoint cannot pass --tcp-established. Next step is driving criu directly inside the container namespaces."
            exit 1
          fi
          # Any other checkpoint failure is equally fatal to the probe's meaning.
          # Run 1 classified as "other", fell through every guard, and declared
          # "Restore verified" about a BC that was never checkpointed.
          if [ "${{ steps.checkpoint.outcome }}" != "success" ]; then
            echo "::error::checkpoint did not succeed — nothing downstream means anything"
            exit 1
          fi
          if [ "${{ steps.restore.outcome }}" = "skipped" ] || [ -z "${{ steps.restore.outputs.odata }}" ]; then
            echo "::error::restore did not run — treating as failure rather than a pass"
            exit 1
          fi
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.restore.outputs.odata }}" != "200" ]; then
            echo "::error::BC did not come back from the checkpoint — the design is dead as specified"
            exit 1
          fi
          if [ "$VERIFY_PUBLISH" = "true" ] && [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "::error::BC restored and served OData but a novel app would not publish — tenant did not survive"
            exit 1
          fi
          echo "Restore verified. Next question is the hard one: restoring against a FRESH SQL container."

      - name: Upload criu dump log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-logs
          path: |
            criu-dump.log
            criu-restore.log
          if-no-files-found: ignore

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose logs bc --tail 120 2>&1 | cut -c1-200 || true
          sudo dmesg | tail -40 || true
          sudo ls -la /var/log/criu* 2>/dev/null || true
